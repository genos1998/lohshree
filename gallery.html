<!DOCTYPE html>
<!--
    REDIRECT STUB — gallery.html now lives at gallery/

    This file exists only so links shared before the move keep working:
    WhatsApp messages, e-mails and quotations already carry the old
    address. The script forwards the fragment as well, so a shared link
    to one photo (gallery.html#photo-12) still opens that photo.
    Safe to delete once those links are no longer in circulation.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting — Lohshree Engineers Pvt. Ltd.</title>
    <link rel="canonical" href="https://genos1998.github.io/lohshree/gallery/">
    <meta name="robots" content="noindex">
    <!-- runs first and carries ?query and #hash across -->
    <script>location.replace('gallery/' + (location.protocol === 'file:' ? 'index.html' : '')
                          + location.search + location.hash);</script>
    <!-- fallback if scripting is off -->
    <meta http-equiv="refresh" content="0; url=gallery/">
    <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 32rem;
               padding: 0 1.5rem; color: #111827; text-align: center; }
        a { color: #1B2ACF; font-weight: 700; }
    </style>
</head>
<body>
    <p>This page has moved.</p>
    <p><a href="gallery/">Continue to Lohshree Engineers</a></p>
</body>
</html>
